name: Delete .plan files
on:
  # 毎月 1 日・15 日の 0 時 UTC（≈ 2 週間周期）に実行
  schedule:
    - cron: "0 0 1,15 * *"
  # 手動実行用のトリガー
  workflow_dispatch:

jobs:
  delete-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # .plan を削除し、PR を作成して main に反映する
      - name: Delete .plan files and create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # .plan が存在しない場合は何もしない
          if ! find . -path ./.git -prune -o -type d -name '.plan' -print | grep -q .; then
            echo ".plan フォルダが存在しないため何もしません。"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # プロジェクト内のすべての .plan を削除（.git 配下は除外）
          find . -path ./.git -prune -o -type d -name '.plan' -exec rm -rf {} +
          git add -A

          # 差分が無ければコミットしない
          if git diff --cached --quiet; then
            echo "変更内容がありません。"
            exit 0
          fi

          # 作業ブランチを作成して push
          BRANCH="chore/remove-plan-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git commit -m "chore: remove .plan files"
          git push origin "$BRANCH"

          # PR を作成
          gh pr create \
            --title "chore: remove .plan files" \
            --body "Scheduled cleanup of .plan directories." \
            --base main
