name: Delete .plan files
on:
  push:
    # まず YK- で始まるブランチに絞り込む（数値以外の分岐はジョブ内で除外する）
    branches:
      - 'YK-*'

jobs:
  delete-plan:
    # branches 指定は fnmatch 形式なので YK-abc など数値以外も拾ってしまう。
    # ここでは正規表現で「YK-」に数値のみが続くブランチだけを扱うように絞る。
    if: ${{ github.ref_name =~ /^YK-[0-9]+$/ }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # プロジェクト内の .plan をすべて削除し、削除コミットをブランチに反映する
      - name: Delete .plan files and commit
        run: |
          # .plan が存在しない場合は何もしない
          if ! find . -path ./.git -prune -o -type d -name '.plan' -print | grep -q .; then
            echo ".plan フォルダが存在しないため何もしません。"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # プロジェクト内のすべての .plan を削除（.git 配下は除外）
          find . -path ./.git -prune -o -type d -name '.plan' -exec rm -rf {} +
          git add -A

          # 差分が無ければコミットしない
          if git diff --cached --quiet; then
            echo "変更内容がありません。"
            exit 0
          fi

          git commit -m "chore: remove .plan files (YK-merge)"
          git push
